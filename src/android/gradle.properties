org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx5120m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.workers.max=1
org.gradle.caching=true
